services:
  db:
    image: postgres:15-alpine
    container_name: mediclear-db
    environment:
      POSTGRES_USER: mediclear_user
      POSTGRES_PASSWORD: mediclear_password
      POSTGRES_DB: mediclear_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
